
F – Framing the problem clearly
A – Assumptions you make before jumping in
D – Debugging with a structured process
E – Execution of solution + long-term fix

Frontend Scenario Questions:
✅ Your React app shows a flicker of unstyled content (FOUC) on every route change. You're using Tailwind and Next.js. What could be causing this and how would you fix it?
✅ Lighthouse says “Avoid large layout shifts,” but you’ve wrapped all content in proper containers. What's your next step to debug and fix CLS?
✅ Your app uses dynamic imports and React.lazy, but LCP is still > 5s. How would you fix this while preserving modularity?
✅ SSR works fine with Next.js, but now React hydration silently fails and pages remain non-interactive. What’s your debugging strategy?
✅ After deployment, a bug appears only in the minified production build — not in dev or staging. What could cause this and how do you fix it?
✅ You added a third-party script and your FID score spiked. What are the ways to keep it without tanking performance?
✅ An SVG icon renders perfectly in dev, but breaks in production. What’s the root cause and fix?
✅ You migrated from CRA to Vite, but some .env variables behave unexpectedly. How would you approach this?
✅ Users report scrolling is smooth on Android Chrome, but janky on iOS Safari. What could be the issue and how do you debug it?
✅ You built infinite scroll, but memory usage increases even when users scroll back. What's leaking and how do you fix it?
✅ In your i18n setup (using next-i18next), changing language causes a full reload. What's misconfigured?
✅ Your PWA doesn’t update favicon dynamically on route change. What’s the correct way to handle this?
✅ On 3G, your app shows a blank screen for 6 seconds even with skeleton loaders. What’s the bottleneck and how would you fix it?
✅ A state update in a nested child component is causing App.tsx to re-render. You’ve memoized and used useCallback. What’s next?
✅ Your optimistic UI updates break when the network fails. Sometimes rollback doesn't restore the original state properly. How would you fix this?
